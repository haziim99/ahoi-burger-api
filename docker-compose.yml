services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ahoi_burger
      API_KEY: ${API_KEY:-dev-api-key}
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure

volumes:
  mongo-data: